<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflect | AI Journal</title>
    <meta name="description" content="A private, AI-powered journaling application." />
    <meta property="og:title" content="Reflect | AI Journal" />
    <meta property="og:description" content="A private, AI-powered journaling application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#171717'; // neutral-900 fallback
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#fafafa'; // neutral-50 fallback
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
